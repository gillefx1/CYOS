<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYOS - Bienvenue</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .half {
            position: relative;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            transition: width 0.5s ease, filter 0.3s ease;
            padding: 40px;
        }
        /* Fenêtre Événement */
        .event {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://unsplash.com') center/cover;
            color: #ffffff;
        }
        /* Fenêtre Héritage */
        .heritage {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://unsplash.com') center/cover;
            color: #ffffff;
            border-left: 2px solid rgba(255,255,255,0.1);
        }
        /* Effets de survol */
        .half:hover {
            width: 55%;
            filter: brightness(1.1);
        }
        .half:hover ~ .half {
            width: 45%;
        }
        body:has(.heritage:hover) .event {
            width: 45%;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            font-weight: 300;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 400;
            opacity: 0.9;
        }
        p {
            font-size: 1rem;
            max-width: 400px;
            line-height: 1.6;
            opacity: 0.8;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            background: transparent;
            transition: all 0.3s ease;
        }
        .half:hover .btn {
            background: #ffffff;
            color: #000000;
        }
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .half { width: 100% !important; height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- Fenêtre CYOS EVENT -->
    <a href="https://cyos-event.be" class="half event">
        <h1>CYOS</h1>
        <h2>Choose Your Own Story</h2>
        <p>De l'idée originale à la coordination du jour J, nous orchestrons vos plus beaux moments de vie.</p>
        <div class="btn">Découvrir</div>
    </a>

    <!-- Fenêtre CYOS HERITAGE -->
    <a href="https://cyos-heritage.com" class="half heritage">
        <h1>CYOS</h1>
        <h2>Continue Your Own Story</h2>
        <p>Transmettez votre histoire, vos valeurs et préservez votre patrimoine familial pour les générations futures.</p>
        <div class="btn">Découvrir</div>
    </a>

</body>
</html>
